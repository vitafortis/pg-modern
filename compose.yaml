# pg·modern — default deployment.
#
#   docker compose up -d
#   open http://<this-host>:3030 and choose an admin password
#
services:
  pg-modern:
    image: ghcr.io/vitafortis/pg-modern:latest
    container_name: pg-modern
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Read-only Docker API (see docker-proxy below) for container discovery.
      PGM_DOCKER_HOSTS: tcp://docker-proxy:2375
      # Folders mounted below that get scanned for .env / compose files.
      PGM_SCAN_PATHS: /stacks
      # Using Arcane? Read its projects over the API instead of mounting folders
      # (key permissions: environments:list, projects:list, projects:read, containers:list, containers:read):
      # PGM_ARCANE_URL: https://arcane.home.arpa
      # PGM_ARCANE_API_KEY: ${PGM_ARCANE_API_KEY}
      # Optional: create the first admin here instead of in the setup wizard.
      # PGM_ADMIN_EMAIL: you@example.com
      # PGM_ADMIN_PASSWORD: ${PGM_ADMIN_PASSWORD}
      # Optional: manage the credential encryption key yourself.
      # Otherwise a random key is generated at /data/secret.key — back it up.
      # PGM_SECRET_KEY: change-me-to-a-long-random-string
      # Single sign-on and Arcane can be set up in the UI (Integrations); these are optional:
      # PGM_OIDC_ISSUER: https://auth.example.com/application/o/pg-modern/
      # PGM_OIDC_CLIENT_ID: pg-modern
      # PGM_OIDC_CLIENT_SECRET: ${PGM_OIDC_CLIENT_SECRET}
      # PGM_OIDC_NAME: Authentik
      # PGM_OIDC_AUTO_CREATE: "*@example.com"
      # PGM_OIDC_ADMIN_EMAILS: you@example.com
      # Behind a TLS reverse proxy, uncomment so secure cookies and SSO callbacks work:
      # PROTOCOL_HEADER: x-forwarded-proto
      # HOST_HEADER: x-forwarded-host
    volumes:
      - pg-modern-data:/data
      # Where your stacks live. Read-only is all pg·modern needs.
      - /opt/stacks:/stacks:ro
      # Database backups on a NAS: mount a share (see volumes below), then add a
      # "Folder" destination at /backups under Backups → Destinations.
      # - nas-backups:/backups
    extra_hosts:
      # Lets pg·modern reach database ports published on the Docker host.
      - host.docker.internal:host-gateway
    depends_on:
      - docker-proxy
    # To reach databases by container name instead of published ports,
    # join their networks too, e.g.:
    # networks: [default, immich_default]

  # pg·modern only lists and inspects containers, so it never gets the raw socket.
  # Note: CONTAINERS=1 also allows GET /containers/{id}/archive (reading files in
  # containers); pg·modern only uses that if you turn on "Read SQLite files from
  # containers" under Integrations. POST=0 keeps writes into containers blocked.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: pg-modern-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pg-modern-data:
  # NAS share for database backups, mounted by Docker itself (no mount on the host).
  # The share must be writable by uid 1000 (the container's "node" user).
  # NFS:
  # nas-backups:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: addr=nas.lan,rw,nfsvers=4
  #     device: ":/volume1/backups/pg-modern"
  # SMB / CIFS:
  # nas-backups:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     o: addr=nas.lan,username=backup,password=${NAS_PASSWORD},uid=1000,gid=1000,file_mode=0600,dir_mode=0700,vers=3.0
  #     device: //nas.lan/backups/pg-modern

# networks:
#   immich_default:
#     external: true
